<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Dusk</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    min-height:100vh;

    font-family:
    "Noto Serif SC",
    serif;

    color:white;

    transition:2s;

    background:
    linear-gradient(
        160deg,
        #f7c978,
        #c87aa3,
        #62528b
    );

}


.container{

    width:90%;
    max-width:900px;

    margin:auto;

    padding:40px 0;

}



.glass{

    background:
    rgba(255,255,255,.15);

    backdrop-filter:blur(15px);

    border-radius:30px;

    padding:30px;

    margin-bottom:25px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.15);

}



h1{

    font-size:55px;

    margin:10px 0;

}


.subtitle{

    opacity:.8;

}



input,select,textarea{

    width:100%;

    padding:15px;

    margin-top:10px;

    border:none;

    border-radius:15px;

    background:
    rgba(255,255,255,.18);

    color:white;

    font-size:16px;

}



button{

    width:100%;

    padding:15px;

    margin-top:15px;

    border:none;

    border-radius:20px;

    background:#ffd77a;

    color:#4b3555;

    font-weight:bold;

    cursor:pointer;

}



#world{

    font-size:14px;

    letter-spacing:3px;

    opacity:.8;

}



#quote{

    line-height:2;

    font-size:18px;

}



textarea{

    min-height:200px;

}



</style>


</head>


<body>


<div class="container">


<div class="glass">


<div id="world">
YOUR DUSK
</div>


<h1 id="title">
Good evening.
</h1>


<p class="subtitle" id="intro">

这里会成为你的黄昏。

</p>


</div>



<div class="glass">


<h2>
创建你的黄昏
</h2>


<input
id="name"
placeholder="你的名字">


<select id="mbti">


<option value="">
选择 MBTI
</option>


<option>INFP</option>
<option>INFJ</option>
<option>INTJ</option>
<option>INTP</option>

<option>ENFP</option>
<option>ENFJ</option>
<option>ENTJ</option>
<option>ENTP</option>

<option>ISFP</option>
<option>ISFJ</option>
<option>ISTJ</option>
<option>ISTP</option>

<option>ESFP</option>
<option>ESFJ</option>
<option>ESTJ</option>
<option>ESTP</option>


</select>



<button onclick="createDusk()">

进入我的黄昏

</button>


</div>




<div class="glass">


<h2 id="diaryTitle">

今日记录

</h2>


<textarea
placeholder="写下今天吧……">
</textarea>


</div>




<div class="glass">


<h2>
今晚给你的话
</h2>


<p id="quote">

等待你的黄昏。

</p>


</div>



</div>


<script>


const worlds={


INFP:{

world:"梦境黄昏",

diary:"写给未来的自己",

intro:
"你拥有一片可以藏下想象和回忆的天空。",

quote:
"你总能发现别人忽略的细节。今晚不用急着解释自己，让黄昏替你保存那些柔软的想法。",

color:
"linear-gradient(160deg,#f6cf83,#c18ac5,#62528b)"

},


INTJ:{

world:"星际观测台",

diary:"今晚的思考",

intro:
"这里属于观察、规划和探索。",

quote:
"计划可以暂停一晚。观察世界，也是一种收集信息。",

color:
"linear-gradient(160deg,#55558a,#34345d,#17172d)"

},


ENFP:{

world:"旅行者黄昏",

diary:"今日发现",

intro:
"把遇见的小惊喜都收藏起来。",

quote:
"你的世界总有新的入口，保持好奇，它会带你去更远的地方。",

color:
"linear-gradient(160deg,#ffd36a,#f18d6d,#a85b91)"

},


ISFP:{

world:"艺术家的窗边",

diary:"今日喜欢",

intro:
"记录那些让你心动的小瞬间。",

quote:
"美好的事情不一定宏大，有时候只是夕阳落下时的一阵风。",

color:
"linear-gradient(160deg,#ffe1a8,#e5a6a6,#80689c)"

}


};



function createDusk(){


let name=
document.getElementById("name").value;


let mbti=
document.getElementById("mbti").value;



if(!worlds[mbti]){

alert("这个版本暂时先支持部分 MBTI，下一版补全16种。");

return;

}



let data=worlds[mbti];



document.body.style.background=
data.color;



document.getElementById("world").innerHTML=
data.world;



document.getElementById("title").innerHTML=
"Good evening, "+name+".";



document.getElementById("intro").innerHTML=
data.intro;



document.getElementById("quote").innerHTML=
data.quote;



document.getElementById("diaryTitle").innerHTML=
data.diary;



}



</script>



</body>

</html>
